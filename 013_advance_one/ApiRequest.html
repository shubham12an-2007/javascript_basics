<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212122; color: #fff;">

    <div>
        <img src="" alt="" class="photo">
        <div class="followers">Followers : </div>
    </div>
    
</body>

<script>

    const requestUrl =  'https://api.github.com/users/shubham12an-2007' ;
    const xhr =  new XMLHttpRequest() ;
    xhr.open('GET' , requestUrl) ;  

    xhr.onreadystatechange = function () {
        console.log(xhr.readyState);
        
        if(xhr.readyState === 4) {

            const data = JSON.parse(this.responseText) ;
            console.log(data);

            const userPhoto = document.querySelector(".photo")  ;
            const followersElement = document.querySelector(".followers") ;

            userPhoto.src = data.avatar_url ;

            const followersData = data.followers ;
            followersElement.innerHTML = `Followers : ${followersData}  ` ;

            
        }
    }
    xhr.send() ;

    
    
</script>
</html>
