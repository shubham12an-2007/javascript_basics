<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="nav-bar">
        <a href="#" class="nav-btn">Home</a>
        <a href="#" class="nav-btn">Youtube channel</a>
    </nav>

    <div id="wrapper">
        <div class="header-box">
            <h1>Number guessing game</h1>
        </div>

        <div class="game-area">
            <p class="instruction">Try and guess a random number between 1 and 100.</p>
            <p class="instruction">You have 10 attempts to guess the right number.</p>
            
            <form class="form">
                <label for="guessField" id="guessHeading">Guess a number</label>
                <input type="text" id="guessField" class="guessField" autocomplete="off">
                <input type="submit" id="subt" value="Submit guess" class="guessSubmit">
            </form>

            <div class="resultParas">
                <p>Previous Guesses: <span class="guesses"></span></p>
                <p>Guesses Remaining: <span class="lastResult">10</span></p>
                <p class="lowOrHi"></p>
            </div>
        </div>
    </div>

</body>

<script src="script.js"></script>
</html>
